name: test-workflow

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install .[tests] black isort mypy types-requests types-mock
      - name: black
        run: |
          black --check .
      - name: isort
        run: |
          isort -c .
      - name: mypy
        run: |
          mypy authalligator_client tests
      - name: flake8
        run: |
          flake8

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    container:
      image: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install .[tests]
      - name: Test
        run: |
          pytest
